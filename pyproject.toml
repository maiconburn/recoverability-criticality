[project]
name = "recoverability-criticality"
version = "0.1.0"
description = "Reproducible tests of spectral reconstruction near quasinormal-mode critical points"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.1",
  "scipy>=1.14",
  "sympy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoverability_ep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

